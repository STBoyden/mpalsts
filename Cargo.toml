[package]
name = "mpalsts"
edition.workspace = true
version.workspace = true

[workspace]
resolver = "3"
members = ["crates/als", "crates/cli", "crates/gui", "crates/shared", "crates/theme-switch"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
needless_return = "allow"

[workspace.lints.rust]
async_fn_in_trait = "allow"
unused_imports = "forbid"

[dependencies]
mpalsts_cli = { path = "./crates/cli", default-features = false }

[features]
default = ["include_gui"]
include_gui = ["mpalsts_cli/include_gui"]

[workspace.dependencies]
anyhow = "1.0.102"
auto-launch = "0.6.0"
directories = "6.0.0"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.29"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[package.metadata.bundle]
name = "Multi-platform ALS Theme Switcher"
identifier = "com.stboyden.mpalsts"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/mpalsts", dest = "/usr/bin/mpalsts", mode = "755" }
]

[package.metadata.deb]
assets = [
  { source = "target/release/mpalsts", dest = "/usr/bin/mpalsts", mode = "755" }
]
