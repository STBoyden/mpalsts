version: 2.1

jobs:
  build-linux:
    parameters:
      distro:
        type: string
      container:
        type: string
      package_format:
        type: enum
        enum: [deb, rpm]
      arch:
        type: enum
        enum: [x86_64, arm64]

    docker:
      - image: << parameters.container >>

    resource_class: << parameters.arch == "arm64" and "arm.medium" or "medium" >>

    environment:
      CARGO_TERM_COLOR: always

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-cargo-linux-<< parameters.distro >>-<< parameters.arch >>-{{ checksum "Cargo.lock" }}
            - v1-cargo-linux-<< parameters.distro >>-<< parameters.arch >>-
            - v1-cargo-linux-

      - run:
          name: Install build dependencies
          command: |
            set -eux

            case "<< parameters.package_format >>" in
              deb)
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  ca-certificates \
                  curl \
                  git \
                  jq \
                  build-essential \
                  pkg-config \
                  clang \
                  libasound2-dev \
                  libfontconfig1-dev \
                  libfreetype6-dev \
                  libwayland-dev \
                  libx11-dev \
                  libx11-xcb-dev \
                  libxcb1-dev \
                  libxcursor-dev \
                  libxi-dev \
                  libxkbcommon-dev \
                  libxkbcommon-x11-dev \
                  libxrandr-dev \
                  libvulkan-dev
                ;;
              rpm)
                dnf install -y \
                  ca-certificates \
                  curl \
                  git \
                  jq \
                  gcc \
                  gcc-c++ \
                  make \
                  pkgconf-pkg-config \
                  clang \
                  binutils \
                  alsa-lib-devel \
                  fontconfig-devel \
                  freetype-devel \
                  libX11-devel \
                  libXcursor-devel \
                  libXi-devel \
                  libxkbcommon-devel \
                  libxkbcommon-x11-devel \
                  libXrandr-devel \
                  libxcb-devel \
                  wayland-devel \
                  vulkan-loader-devel
                ;;
              *)
                echo "Unsupported package format: << parameters.package_format >>" >&2
                exit 1
                ;;
            esac

      - run:
          name: Ensure Node.js v24
          command: |
            set -eux

            if [ "<< parameters.container >>" = "node:latest" ]; then
              exit 0
            fi

            case "<< parameters.arch >>" in
              arm64)
                node_url="https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-arm64.tar.xz"
                node_dir="node-v24.15.0-linux-arm64"
                ;;
              x86_64)
                node_url="https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz"
                node_dir="node-v24.15.0-linux-x64"
                ;;
              *)
                echo "Unsupported architecture: << parameters.arch >>" >&2
                exit 1
                ;;
            esac

            curl -fsSL -o node.tar.xz "$node_url"
            tar -xf node.tar.xz
            mv "$node_dir"/bin/* /usr/local/bin/
            rm -rf node.tar.xz "$node_dir"

      - run:
          name: Install Rust
          command: |
            set -eux

            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable

            . "$HOME/.cargo/env"

            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"

            case "<< parameters.arch >>" in
              x86_64)
                RUST_TARGET=x86_64-unknown-linux-gnu
                PACKAGE_ARCH=amd64
                ;;
              arm64)
                RUST_TARGET=aarch64-unknown-linux-gnu
                PACKAGE_ARCH=arm64
                ;;
              *)
                echo "Unsupported architecture: << parameters.arch >>" >&2
                exit 1
                ;;
            esac

            echo "export RUST_TARGET=$RUST_TARGET" >> "$BASH_ENV"
            echo "export PACKAGE_ARCH=$PACKAGE_ARCH" >> "$BASH_ENV"

            rustup target add "$RUST_TARGET"

      - run:
          name: Get package version
          command: |
            version=$(cargo metadata --format-version 1 | jq -r '.packages[] | select (.name | test("mpalsts")) | .version')
            echo "export PACKAGE_VERSION=$version" >> "$BASH_ENV"

      - run:
          name: Install package tooling
          command: |
            set -eux

            case "<< parameters.package_format >>" in
              deb)
                cargo install cargo-deb --force
                ;;
              rpm)
                cargo install cargo-generate-rpm --force
                ;;
              *)
                echo "Unsupported package format: << parameters.package_format >>" >&2
                exit 1
                ;;
            esac

      - run:
          name: Build release binary
          command: cargo build --release

      - run:
          name: Strip binary
          command: strip -s target/release/mpalsts

      - run:
          name: Generate package artifact
          command: |
            set -eux

            case "<< parameters.package_format >>" in
              deb)
                cargo deb
                ;;
              rpm)
                cargo generate-rpm
                ;;
              *)
                echo "Unsupported package format: << parameters.package_format >>" >&2
                exit 1
                ;;
            esac

      - run:
          name: Collect artifacts
          command: |
            set -eux

            mkdir -p artifacts

            find target -type f \( -name "*.deb" -o -name "*.rpm" \) \
              -exec cp {} "artifacts/mpalsts_${PACKAGE_VERSION}_<< parameters.distro >>_<< parameters.arch >>.<< parameters.package_format >>" \;

            ls -R artifacts

      - save_cache:
          key: v1-cargo-linux-<< parameters.distro >>-<< parameters.arch >>-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.cargo/bin

      - persist_to_workspace:
          root: .
          paths:
            - artifacts

      - store_artifacts:
          path: artifacts
          destination: mpalsts-<< parameters.distro >>-<< parameters.arch >>-<< parameters.package_format >>

  build-macos:
    macos:
      xcode: "26.5"

    resource_class: m4pro.medium

    environment:
      CARGO_TERM_COLOR: always

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-cargo-macos-{{ checksum "Cargo.lock" }}
            - v1-cargo-macos-

      - run:
          name: Install Rust
          command: |
            set -eux

            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable

            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Install cargo-bundle
          command: cargo install cargo-bundle --version 0.10.0 --locked --force

      - run:
          name: Install create-dmg
          command: brew install create-dmg

      - run:
          name: Build macOS app bundle
          command: cargo bundle --release --format osx

      - run:
          name: Create DMG
          command: |
            set -eux

            create-dmg \
              --volname "MPALSTS" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --app-drop-link 600 185 \
              --skip-jenkins \
              "target/release/bundle/osx/MPALSTS.dmg" \
              "target/release/bundle/osx/Multi-platform ALS Theme Switcher.app"

      - run:
          name: Collect artifacts
          command: |
            set -eux

            mkdir -p artifacts

            cp target/release/bundle/osx/MPALSTS.dmg artifacts/

            ls -R artifacts

      - save_cache:
          key: v1-cargo-macos-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.cargo/bin

      - persist_to_workspace:
          root: .
          paths:
            - artifacts

      - store_artifacts:
          path: artifacts
          destination: mpalsts-macos-app

  publish-release-assets:
    docker:
      - image: fedora:latest

    resource_class: small

    steps:
      - attach_workspace:
          at: /tmp/workspace

      - run:
          name: Install release tooling
          command: |
            set -eux

            dnf install -y curl jq

      - run:
          name: Upload artifacts to tagged Forgejo release
          command: |
            set -euo pipefail

            : "${CB_PAT:?CB_PAT must be configured in CircleCI}"
            : "${CIRCLE_TAG:?This workflow must run from a Git tag}"

            api_root="https://codeberg.org/api/v1"
            repo="STBoyden/mpalsts"
            tag="$CIRCLE_TAG"
            encoded_tag=$(jq -nr --arg tag "$tag" '$tag | @uri')
            auth_header="Authorization: token ${CB_PAT}"

            request_status() {
              local output_file="$1"
              shift

              curl -sS \
                -w "%{http_code}" \
                -o "$output_file" \
                -H "$auth_header" \
                "$@"
            }

            release_response="$(mktemp)"
            status=$(request_status "$release_response" \
              "$api_root/repos/$repo/releases/tags/$encoded_tag")

            if [ "$status" = "404" ]; then
              echo "No Forgejo release found for tag $tag; creating one."

              create_payload=$(jq -n \
                --arg tag "$tag" \
                '{tag_name: $tag, name: $tag, body: "Automated release artifacts for \($tag).", draft: false, prerelease: false}')

              status=$(request_status "$release_response" \
                -X POST \
                -H "Content-Type: application/json" \
                -d "$create_payload" \
                "$api_root/repos/$repo/releases")
            else
              echo "Found Forgejo release for tag $tag."
            fi

            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "Failed to fetch or create Forgejo release for tag $tag (HTTP $status):" >&2
              cat "$release_response" >&2
              exit 1
            fi

            release_id=$(jq -r '.id' "$release_response")
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "Forgejo release response did not include an id:" >&2
              cat "$release_response" >&2
              exit 1
            fi

            echo "Workspace contents:"
            find /tmp/workspace -type f

            find /tmp/workspace/artifacts -type f \
              \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) \
              | sort \
              | while read -r artifact; do
                  asset_name=$(basename "$artifact")
                  encoded_asset_name=$(jq -nr --arg name "$asset_name" '$name | @uri')
                  upload_response="$(mktemp)"

                  status=$(request_status "$upload_response" \
                    -X POST \
                    -F "attachment=@${artifact}" \
                    "$api_root/repos/$repo/releases/$release_id/assets?name=$encoded_asset_name")

                  if [ "$status" != "200" ] && [ "$status" != "201" ]; then
                    echo "Failed to upload $asset_name (HTTP $status):" >&2
                    cat "$upload_response" >&2
                    exit 1
                  fi

                  echo "Uploaded $asset_name"
                done

      - run:
          name: Upload artifacts to tagged GitHub release
          command: |
            set -euo pipefail

            github_token="${GH_PAT:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}"
            : "${github_token:?GH_PAT, GH_TOKEN, or GITHUB_TOKEN must be configured in CircleCI}"
            : "${CIRCLE_TAG:?This workflow must run from a Git tag}"

            api_root="https://api.github.com"
            repo="${GITHUB_REPOSITORY:-STBoyden/mpalsts}"
            tag="$CIRCLE_TAG"
            encoded_tag=$(jq -nr --arg tag "$tag" '$tag | @uri')
            auth_header="Authorization: Bearer ${github_token}"
            accept_header="Accept: application/vnd.github+json"
            api_version_header="X-GitHub-Api-Version: 2022-11-28"

            request_status() {
              local output_file="$1"
              shift

              curl -sS \
                -w "%{http_code}" \
                -o "$output_file" \
                -H "$auth_header" \
                -H "$accept_header" \
                -H "$api_version_header" \
                "$@"
            }

            release_response="$(mktemp)"
            status=$(request_status "$release_response" \
              "$api_root/repos/$repo/releases/tags/$encoded_tag")

            if [ "$status" = "404" ]; then
              echo "No GitHub release found for tag $tag; creating one."

              create_payload=$(jq -n \
                --arg tag "$tag" \
                '{tag_name: $tag, name: $tag, body: "Automated release artifacts for \($tag).", draft: false, prerelease: false}')

              status=$(request_status "$release_response" \
                -X POST \
                -H "Content-Type: application/json" \
                -d "$create_payload" \
                "$api_root/repos/$repo/releases")
            else
              echo "Found GitHub release for tag $tag."
            fi

            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "Failed to fetch or create GitHub release for tag $tag (HTTP $status):" >&2
              cat "$release_response" >&2
              exit 1
            fi

            upload_url=$(jq -r '.upload_url | sub("\\{.*$"; "")' "$release_response")
            if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
              echo "GitHub release response did not include an upload_url:" >&2
              cat "$release_response" >&2
              exit 1
            fi

            find /tmp/workspace/artifacts -type f \
              \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) \
              | sort \
              | while read -r artifact; do
                  asset_name=$(basename "$artifact")
                  encoded_asset_name=$(jq -nr --arg name "$asset_name" '$name | @uri')
                  upload_response="$(mktemp)"

                  status=$(request_status "$upload_response" \
                    -X POST \
                    -H "Content-Type: application/octet-stream" \
                    --data-binary "@${artifact}" \
                    "$upload_url?name=$encoded_asset_name")

                  if [ "$status" != "201" ]; then
                    echo "Failed to upload $asset_name (HTTP $status):" >&2
                    cat "$upload_response" >&2
                    exit 1
                  fi

                  echo "Uploaded $asset_name"
                done

workflows:
  tagged-release:
    jobs:
      - build-linux:
          name: build-linux-debian-x86_64
          distro: debian
          container: node:latest
          package_format: deb
          arch: x86_64
          filters: &tagged_release_filters
            tags:
              only: /.*/
            branches:
              ignore: /.*/

      - build-linux:
          name: build-linux-ubuntu-x86_64
          distro: ubuntu
          container: ubuntu:latest
          package_format: deb
          arch: x86_64
          filters: *tagged_release_filters

      - build-linux:
          name: build-linux-fedora-x86_64
          distro: fedora
          container: fedora:latest
          package_format: rpm
          arch: x86_64
          filters: *tagged_release_filters

      - build-linux:
          name: build-linux-debian-arm64
          distro: debian
          container: node:latest
          package_format: deb
          arch: arm64
          filters: *tagged_release_filters

      - build-linux:
          name: build-linux-ubuntu-arm64
          distro: ubuntu
          container: ubuntu:latest
          package_format: deb
          arch: arm64
          filters: *tagged_release_filters

      - build-linux:
          name: build-linux-fedora-arm64
          distro: fedora
          container: fedora:latest
          package_format: rpm
          arch: arm64
          filters: *tagged_release_filters

      - build-macos:
          filters: *tagged_release_filters

      - publish-release-assets:
          requires:
            - build-linux-debian-x86_64
            - build-linux-ubuntu-x86_64
            - build-linux-fedora-x86_64
            - build-linux-debian-arm64
            - build-linux-ubuntu-arm64
            - build-linux-fedora-arm64
            - build-macos
          filters: *tagged_release_filters
